name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Cần SDK macOS 26 trở lên (LockScreenMusic dùng glassEffect): chọn Xcode 26 mới nhất có trên runner.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version || true
          swift --version

      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}-${{ hashFiles('Package.swift', 'Sources/**', 'Packages/**', 'Tests/**') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}-

      - name: Build hook
        run: swift build --product notch-hook

      - name: Hook socket protocol test
        run: python3 -I scripts/test_hook.py .build/debug/notch-hook

      - name: Build app
        run: swift build --product Notch

      - name: Unit tests
        run: swift test
