<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b3b6b"/>
      <stop offset="1" stop-color="#1f1d36"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe9c4" stop-opacity=".35"/>
      <stop offset=".5" stop-color="#ffe9c4" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffe9c4" stop-opacity=".25"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="400" rx="28"/></clipPath>
    <clipPath id="screen"><rect x="48" y="124" width="1184" height="320" rx="20"/></clipPath>
    <clipPath id="cam"><rect x="366" y="162" width="300" height="190" rx="18"/></clipPath>
    <filter id="b60" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="b18" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="b12" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .breathe { animation: breathe 2.6s ease-in-out infinite alternate; }
    @keyframes breathe { from { opacity: .45; } to { opacity: .95; } }
    .blink { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 4.5s infinite; }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  </style>
  <g clip-path="url(#card)">
    <rect width="1280" height="400" fill="#0d0d18"/>
    <circle cx="1120" cy="40" r="200" fill="#ffd27a" opacity=".22" filter="url(#b60)"/>
    <circle cx="160" cy="40" r="180" fill="#8b5cf6" opacity=".25" filter="url(#b60)"/>
    <text x="48" y="66" font-size="28" font-weight="800" fill="#fff">Soi gương trước khi họp, có cả đèn</text>
    <text x="48" y="98" font-size="15" fill="#fff" opacity=".6">Camera ngay trên notch · đèn viền rọi sáng mặt khi phòng tối · vào Meet một chạm</text>

    <!-- Màn hình + đèn viền -->
    <rect x="48" y="124" width="1184" height="320" rx="20" fill="url(#wall)"/>
    <g clip-path="url(#screen)">
      <rect x="48" y="124" width="1184" height="26" fill="#fff" opacity=".14"/>
      <rect class="breathe" x="48" y="124" width="1184" height="320" rx="20" fill="none" stroke="#ffe7c2" stroke-width="90" filter="url(#b18)"/>
      <rect x="48" y="124" width="1184" height="320" rx="20" fill="none" stroke="#fff3df" stroke-width="44"/>
      <g font-size="14" font-weight="600" fill="#fff" opacity=".9">
        <text x="98" y="300">← Đèn viền: Dịu · Vừa · Mạnh</text>
        <text x="1182" y="300" text-anchor="end">Camera tự tắt khi rời tab ✓</text>
      </g>
    </g>

    <!-- Notch mở tab gương -->
    <path d="M330 124 Q346 124 346 140 L346 342 Q346 370 374 370 L906 370 Q934 370 934 342 L934 140 Q934 124 950 124 Z" fill="#000" opacity=".55" transform="translate(0 8)" filter="url(#b12)"/>
    <path d="M330 124 Q346 124 346 140 L346 342 Q346 370 374 370 L906 370 Q934 370 934 342 L934 140 Q934 124 950 124 Z" fill="#000"/>

    <text x="374" y="146" font-size="12" fill="#fff" opacity=".45" text-anchor="middle">♪</text>
    <g fill="#fff" opacity=".45">
      <rect x="397" y="134" width="11" height="1.8" rx=".9"/>
      <rect x="396" y="137" width="13" height="1.8" rx=".9"/>
      <path d="M393 140.5 h4 l2 2.3 h6.5 l2 -2.3 h4 v5 a2 2 0 0 1 -2 2 h-14.5 a2 2 0 0 1 -2 -2 z"/>
    </g>
    <rect x="426" y="130" width="38" height="22" rx="11" fill="#fff" opacity=".14"/>
    <g fill="#fff">
      <rect x="437" y="136" width="16" height="11" rx="3"/>
      <rect x="442" y="133.6" width="6.5" height="3.2" rx="1.1"/>
    </g>
    <circle cx="445" cy="141.5" r="3" fill="#000"/>

    <!-- Khung camera: nhân vật minh hoạ -->
    <g clip-path="url(#cam)">
      <rect x="366" y="162" width="300" height="190" fill="url(#room)"/>
      <rect x="590" y="178" width="58" height="80" rx="6" fill="#ffe2b3" opacity=".18"/>
      <path d="M410 352 C 418 300, 462 288, 516 288 S 614 300, 622 352 Z" fill="url(#shirt)"/>
      <rect x="504" y="262" width="24" height="32" rx="9" fill="#d99a76"/>
      <ellipse cx="516" cy="234" rx="34" ry="40" fill="#f0b893"/>
      <path d="M481 232 C 478 194, 500 184, 518 184 C 541 184, 557 197, 552 230 C 546 212, 531 204, 516 204 C 500 204, 487 213, 481 232 Z" fill="#2b1d1a"/>
      <g class="blink">
        <circle cx="504" cy="238" r="3.2" fill="#2b1d1a"/>
        <circle cx="528" cy="238" r="3.2" fill="#2b1d1a"/>
      </g>
      <path d="M505 254 Q516 263 527 254" fill="none" stroke="#8a4b3c" stroke-width="2.6" stroke-linecap="round"/>
      <rect class="breathe" x="366" y="162" width="300" height="190" fill="url(#lit)"/>
    </g>
    <rect x="366" y="162" width="300" height="190" rx="18" fill="none" stroke="#fff" stroke-opacity=".15"/>

    <!-- Cột phải -->
    <text x="690" y="188" font-size="16" font-weight="800" fill="#fff">Sẵn sàng họp?</text>
    <rect x="690" y="202" width="3" height="32" rx="1.5" fill="#4cd6c8"/>
    <text x="700" y="215" font-size="13" font-weight="700" fill="#fff" opacity=".92">Daily standup</text>
    <text x="700" y="231" font-size="11.5" fill="#fff" opacity=".55">Sau 4 phút · 09:30</text>
    <rect x="852" y="207" width="62" height="22" rx="11" fill="#0a84ff"/>
    <rect x="861" y="214" width="9" height="8" rx="2" fill="#fff"/>
    <path d="M871 218 l4 -3 v6 z" fill="#fff"/>
    <text x="879" y="222.5" font-size="10.5" font-weight="700" fill="#fff">Meet</text>

    <rect x="690" y="290" width="226" height="26" rx="13" fill="#fff" fill-opacity=".12"/>
    <path d="M704 299 h12 m-3 -3 l3 3 l-3 3 M716 307 h-12 m3 -3 l-3 3 l3 3" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="726" y="307.5" font-size="12.5" font-weight="600" fill="#fff" opacity=".9">Lật: gương</text>

    <rect x="690" y="324" width="226" height="26" rx="13" fill="#ffdc8c"/>
    <circle cx="710" cy="334" r="5" fill="#2a2418"/>
    <rect x="707.5" y="339" width="5" height="4" rx="1" fill="#2a2418"/>
    <text x="726" y="341.5" font-size="12.5" font-weight="700" fill="#2a2418">Đèn: Vừa</text>
  </g>
  <rect x=".5" y=".5" width="1279" height="399" rx="27.5" fill="none" stroke="#fff" stroke-opacity=".08"/>
</svg>
