<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0e9aa7"/>
    </linearGradient>
    <clipPath id="card"><rect width="640" height="380" rx="28"/></clipPath>
    <filter id="b60" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="b12" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="b6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ants { stroke-dasharray: 7 5; animation: ants 1s linear infinite; }
    @keyframes ants { to { stroke-dashoffset: -24; } }
    .bob { animation: bob 1.6s ease-in-out infinite alternate; }
    @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-9px); } }
  </style>
  <g clip-path="url(#card)">
    <rect width="640" height="380" fill="#0d0d18"/>
    <circle cx="580" cy="320" r="170" fill="#22d3ee" opacity=".25" filter="url(#b60)"/>
    <text x="36" y="56" font-size="24" font-weight="800" fill="#fff">Kéo file lên notch, thả ra bất cứ đâu</text>
    <text x="36" y="84" font-size="14" fill="#fff" opacity=".6">File đổi tên hay chuyển chỗ vẫn còn trong khay. Chuột phải để AirDrop hoặc chia sẻ.</text>

    <rect x="36" y="112" width="568" height="300" rx="18" fill="url(#wall)"/>
    <rect x="36" y="112" width="568" height="26" fill="#fff" opacity=".18"/>

    <path d="M70 112 Q84 112 84 126 L84 246 Q84 272 110 272 L530 272 Q556 272 556 246 L556 126 Q556 112 570 112 Z" fill="#000" opacity=".5" transform="translate(0 8)" filter="url(#b12)"/>
    <path d="M70 112 Q84 112 84 126 L84 246 Q84 272 110 272 L530 272 Q556 272 556 246 L556 126 Q556 112 570 112 Z" fill="#000"/>

    <text x="115" y="130" font-size="11" fill="#fff" opacity=".45" text-anchor="middle">♪</text>
    <rect x="132" y="116" width="34" height="20" rx="10" fill="#fff" opacity=".14"/>
    <g fill="#fff">
      <rect x="143" y="119.5" width="12" height="1.8" rx=".9"/>
      <rect x="142" y="122.6" width="14" height="1.8" rx=".9"/>
      <path d="M139 126 h4.5 l2 2.4 h7 l2 -2.4 h4.5 v5 a2 2 0 0 1 -2 2 h-16 a2 2 0 0 1 -2 -2 z"/>
    </g>
    <circle cx="164" cy="118" r="5.5" fill="#fff"/>
    <text x="164" y="121" font-size="7.5" font-weight="800" fill="#000" text-anchor="middle">3</text>
    <g fill="#fff" opacity=".45">
      <rect x="180" y="120" width="16" height="11" rx="3"/>
      <rect x="185" y="117.6" width="6.5" height="3.2" rx="1.1"/>
    </g>
    <circle cx="188" cy="125.5" r="3" fill="#000"/>

    <!-- 3 file trong khay -->
    <g font-size="9" font-weight="800" fill="#fff" text-anchor="middle">
      <path d="M121 160 h28 l12 12 v40 a3 3 0 0 1 -3 3 h-37 a3 3 0 0 1 -3 -3 v-49 a3 3 0 0 1 3 -3 z" fill="#ff5a52"/>
      <path d="M149 160 v9 a3 3 0 0 0 3 3 h9 z" fill="#fff" opacity=".45"/>
      <text x="140" y="207">PDF</text>
      <path d="M211 160 h28 l12 12 v40 a3 3 0 0 1 -3 3 h-37 a3 3 0 0 1 -3 -3 v-49 a3 3 0 0 1 3 -3 z" fill="#30b05a"/>
      <path d="M239 160 v9 a3 3 0 0 0 3 3 h9 z" fill="#fff" opacity=".45"/>
      <text x="230" y="207">PNG</text>
      <path d="M301 160 h28 l12 12 v40 a3 3 0 0 1 -3 3 h-37 a3 3 0 0 1 -3 -3 v-49 a3 3 0 0 1 3 -3 z" fill="#8e8e93"/>
      <path d="M329 160 v9 a3 3 0 0 0 3 3 h9 z" fill="#fff" opacity=".45"/>
      <text x="320" y="207">ZIP</text>
    </g>
    <g font-size="11" fill="#fff" opacity=".8" text-anchor="middle">
      <text x="140" y="238">bao-cao.pdf</text>
      <text x="230" y="238">mockup.png</text>
      <text x="320" y="238">release.zip</text>
    </g>

    <!-- Vùng thả -->
    <rect x="384" y="152" width="150" height="98" rx="14" fill="#fff" fill-opacity=".07"/>
    <rect class="ants" x="384" y="152" width="150" height="98" rx="14" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1.6"/>
    <path d="M459 172 v22 m-8 -8 l8 8 l8 -8" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M446 200 h26" stroke="#fff" stroke-opacity=".9" stroke-width="2.2" stroke-linecap="round"/>
    <text x="459" y="228" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Thả vào khay</text>

    <!-- Menu chuột phải trên mockup.png -->
    <g>
      <rect x="226" y="212" width="150" height="130" rx="8" fill="#000" opacity=".45" transform="translate(0 6)" filter="url(#b12)"/>
      <rect x="226" y="212" width="150" height="130" rx="8" fill="#2a2a30" fill-opacity=".97" stroke="#fff" stroke-opacity=".12"/>
      <g font-size="12" fill="#fff">
        <text x="240" y="232" opacity=".9">Mở</text>
        <text x="240" y="252" opacity=".9">Hiện trong Finder</text>
        <line x1="236" y1="261" x2="366" y2="261" stroke="#fff" stroke-opacity=".12"/>
        <rect x="230" y="267" width="142" height="19" rx="4" fill="#0a84ff"/>
        <text x="240" y="281" font-weight="600">AirDrop</text>
        <text x="240" y="301" opacity=".9">Chia sẻ</text>
        <text x="362" y="301" opacity=".6" text-anchor="end">›</text>
        <line x1="236" y1="310" x2="366" y2="310" stroke="#fff" stroke-opacity=".12"/>
        <text x="240" y="330" opacity=".9">Gỡ khỏi khay</text>
      </g>
      <path d="M0 0 L0 17 L4.5 13 L7.5 20 L10 19 L7 12 L13 12 Z" transform="translate(330 276)" fill="#000" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/>
    </g>

    <!-- File đang kéo -->
    <g transform="translate(470 298) rotate(-10)">
      <g class="bob">
        <path d="M3 4 h28 l12 12 v40 a3 3 0 0 1 -3 3 h-37 a3 3 0 0 1 -3 -3 v-49 a3 3 0 0 1 3 -3 z" fill="#000" opacity=".35" filter="url(#b6)"/>
        <path d="M0 0 h28 l12 12 v40 a3 3 0 0 1 -3 3 h-37 a3 3 0 0 1 -3 -3 v-49 a3 3 0 0 1 3 -3 z" fill="#a855f7"/>
        <path d="M28 0 v9 a3 3 0 0 0 3 3 h9 z" fill="#fff" opacity=".45"/>
        <text x="17" y="46" font-size="9" font-weight="800" fill="#fff" text-anchor="middle">SVG</text>
        <path d="M0 0 L0 17 L4.5 13 L7.5 20 L10 19 L7 12 L13 12 Z" transform="translate(30 38)" fill="#000" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
  <rect x=".5" y=".5" width="639" height="379" rx="27.5" fill="none" stroke="#fff" stroke-opacity=".08"/>
</svg>
