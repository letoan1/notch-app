<style>
text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.scan { animation: scan 4.4s ease-in-out infinite; }
@keyframes scan { 0%, 8% { opacity: 0; } 12%, 52% { opacity: 1; } 58%, 100% { opacity: 0; } }
.line { animation: line 1.1s ease-in-out infinite alternate; }
@keyframes line { from { transform: translateY(0); } to { transform: translateY(14px); } }
.ok { opacity: 0; animation: ok 4.4s ease-out infinite; }
@keyframes ok { 0%, 55% { opacity: 0; } 60%, 92% { opacity: 1; } 100% { opacity: 0; } }
.dot { opacity: 0; animation: dot 4.4s steps(1) infinite; }
@keyframes dot { 0%, 60% { opacity: 0; } 61%, 92% { opacity: 1; } 93%, 100% { opacity: 0; } }
.shack { animation: shack 4.4s ease-in-out infinite; }
@keyframes shack { 0%, 76% { transform: translateY(0); } 82%, 92% { transform: translateY(-4px); } 100% { transform: translateY(0); } }
</style>
