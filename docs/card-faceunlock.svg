<defs>
<linearGradient id="lock" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset=".6" stop-color="#6d28d9"/><stop offset="1" stop-color="#db2777"/></linearGradient>
<clipPath id="card"><rect width="640" height="400" rx="28"/></clipPath>
