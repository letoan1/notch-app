<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2a6e"/>
      <stop offset="1" stop-color="#b0566b"/>
    </linearGradient>
    <clipPath id="card"><rect width="640" height="380" rx="28"/></clipPath>
    <filter id="b60" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="b12" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
    .pulse { transform-box: fill-box; transform-origin: 50% 50%; animation: pulse 1.8s ease-out infinite; }
    @keyframes pulse { 0% { transform: scale(.3); opacity: .9; } 100% { transform: scale(3.2); opacity: 0; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="640" height="380" fill="#0d0d18"/>
    <circle cx="560" cy="60" r="160" fill="#d97757" opacity=".35" filter="url(#b60)"/>
    <text x="36" y="56" font-size="24" font-weight="800" fill="#fff">Duyệt lệnh Claude ngay trên notch</text>
    <text x="36" y="84" font-size="14" fill="#fff" opacity=".6">Cho phép, từ chối hoặc luôn cho phép mà không phải chuyển Desktop</text>

    <rect x="36" y="112" width="568" height="300" rx="18" fill="url(#wall)"/>
    <rect x="36" y="112" width="568" height="26" fill="#fff" opacity=".18"/>

    <path d="M70 112 Q84 112 84 126 L84 264 Q84 290 110 290 L530 290 Q556 290 556 264 L556 126 Q556 112 570 112 Z" fill="#000" opacity=".5" transform="translate(0 8)" filter="url(#b12)"/>
    <path d="M70 112 Q84 112 84 126 L84 264 Q84 290 110 290 L530 290 Q556 290 556 264 L556 126 Q556 112 570 112 Z" fill="#000"/>

    <rect x="100" y="117" width="30" height="18" rx="9" fill="#fff" opacity=".12"/>
    <text x="115" y="130" font-size="11" fill="#fff" text-anchor="middle">♪</text>

    <path d="M110 156 L112.5 163.5 L120 166 L112.5 168.5 L110 176 L107.5 168.5 L100 166 L107.5 163.5 Z" fill="#d97757"/>
    <text x="128" y="171" font-size="14" font-weight="700" fill="#fff">Claude xin quyền</text>
    <text x="250" y="171" font-size="14" font-weight="600" fill="#fff" opacity=".45">· my-app</text>

    <rect x="104" y="186" width="44" height="20" rx="10" fill="#d97757" fill-opacity=".2"/>
    <text x="126" y="200" font-size="11" font-weight="700" fill="#ec9a7b" text-anchor="middle">Bash</text>
    <text x="160" y="201" class="mono" font-size="14" fill="#fff" opacity=".92">npm run build &amp;&amp; npm test</text>

    <g font-size="13" font-weight="700" text-anchor="middle">
      <rect x="232" y="236" width="80" height="28" rx="14" fill="#fff" fill-opacity=".1"/>
      <text x="272" y="255" fill="#fff" opacity=".8">Từ chối</text>
      <rect x="320" y="236" width="116" height="28" rx="14" fill="#fff" fill-opacity=".1"/>
      <text x="378" y="255" fill="#fff">Luôn cho phép</text>
      <rect x="444" y="236" width="92" height="28" rx="14" fill="#d97757"/>
      <text x="490" y="255" fill="#fff">Cho phép</text>
    </g>

    <circle class="pulse" cx="527" cy="258" r="8" fill="none" stroke="#fff" stroke-width="2"/>
    <path d="M0 0 L0 17 L4.5 13 L7.5 20 L10 19 L7 12 L13 12 Z" transform="translate(525 256)" fill="#000" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/>
  </g>
  <rect x=".5" y=".5" width="639" height="379" rx="27.5" fill="none" stroke="#fff" stroke-opacity=".08"/>
</svg>
