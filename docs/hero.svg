<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0b16"/>
      <stop offset="1" stop-color="#05050a"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a40d9"/>
      <stop offset=".55" stop-color="#8a46d6"/>
      <stop offset="1" stop-color="#ff6a9a"/>
    </linearGradient>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="0" y1="300" x2="0" y2="490">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="screenFade"><rect width="1280" height="720" fill="url(#fade)"/></mask>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff4f8b"/>
    </linearGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#9fb2ff"/>
      <stop offset=".5" stop-color="#d79bff"/>
      <stop offset="1" stop-color="#ff86c0"/>
    </linearGradient>
    <clipPath id="screen"><rect x="120" y="40" width="1040" height="500" rx="26"/></clipPath>
    <filter id="b90" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="90"/></filter>
    <filter id="b30" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="b16" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .eq { transform-box: fill-box; transform-origin: 50% 50%; animation: eq .8s ease-in-out infinite alternate; }
    .e2 { animation-duration: .55s; } .e3 { animation-duration: .95s; } .e4 { animation-duration: .68s; }
    @keyframes eq { from { transform: scaleY(.3); } to { transform: scaleY(1); } }
    .glow { animation: glow 3.2s ease-in-out infinite alternate; }
    @keyframes glow { from { opacity: .35; } to { opacity: .9; } }
    .prog { transform-box: fill-box; transform-origin: 0 50%; animation: prog 14s linear infinite; }
    @keyframes prog { from { transform: scaleX(.25); } to { transform: scaleX(1); } }
  </style>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="230" cy="640" r="230" fill="#5b5bf6" opacity=".35" filter="url(#b90)"/>
  <circle cx="1060" cy="620" r="250" fill="#ff4f9a" opacity=".28" filter="url(#b90)"/>
  <circle cx="640" cy="330" r="280" fill="#8a46d6" opacity=".22" filter="url(#b90)"/>

  <!-- Màn hình MacBook, mờ dần xuống dưới -->
  <g mask="url(#screenFade)">
    <rect x="104" y="24" width="1072" height="540" rx="40" fill="#16161d" stroke="#2c2c38" stroke-width="2"/>
    <rect x="120" y="40" width="1040" height="500" rx="26" fill="url(#wall)"/>
    <g clip-path="url(#screen)">
      <path d="M120 330 C 340 250, 520 420, 760 330 S 1080 260, 1160 300 L1160 540 L120 540 Z" fill="#fff" opacity=".07"/>
      <path d="M120 400 C 380 330, 600 470, 860 390 S 1100 360, 1160 380 L1160 540 L120 540 Z" fill="#fff" opacity=".06"/>
      <rect x="120" y="40" width="1040" height="34" fill="#fff" opacity=".2"/>
      <g font-size="13" fill="#fff">
        <text x="150" y="62" font-weight="700">Notch</text>
        <text x="206" y="62" opacity=".9">File</text>
        <text x="244" y="62" opacity=".9">Edit</text>
        <text x="284" y="62" opacity=".9">View</text>
        <text x="1132" y="62" text-anchor="end" opacity=".95">Th 6 13 thg 11  9:41</text>
      </g>
      <rect x="985" y="51" width="22" height="11" rx="3" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="1.3"/>
      <rect x="987.5" y="53.5" width="13" height="6" rx="1.5" fill="#fff" opacity=".85"/>
      <rect x="1008" y="54.5" width="1.6" height="4" rx=".8" fill="#fff" opacity=".85"/>
    </g>

    <!-- Quầng sáng + bóng dưới notch -->
    <ellipse class="glow" cx="640" cy="282" rx="320" ry="46" fill="#b06cff" filter="url(#b30)"/>
    <path d="M330 40 Q346 40 346 56 L346 243 Q346 275 378 275 L902 275 Q934 275 934 243 L934 56 Q934 40 950 40 Z" fill="#000" opacity=".55" transform="translate(0 10)" filter="url(#b16)"/>

    <!-- Notch đang mở -->
    <path d="M330 40 Q346 40 346 56 L346 243 Q346 275 378 275 L902 275 Q934 275 934 243 L934 56 Q934 40 950 40 Z" fill="#000"/>
    <path d="M346 200 L346 243 Q346 275 378 275 L902 275 Q934 275 934 243 L934 200" fill="none" stroke="#fff" stroke-opacity=".08"/>

    <!-- Hàng tab -->
    <rect x="370" y="46" width="34" height="22" rx="11" fill="#fff" opacity=".14"/>
    <text x="387" y="62" font-size="13" fill="#fff" text-anchor="middle">♪</text>
    <!-- icon khay + badge, icon camera -->
    <g fill="#fff" opacity=".45">
      <rect x="420" y="49" width="12" height="2" rx="1"/>
      <rect x="419" y="52.5" width="14" height="2" rx="1"/>
      <path d="M416 56 h4.5 l2 2.6 h7 l2 -2.6 h4.5 v6 a2 2 0 0 1 -2 2 h-16 a2 2 0 0 1 -2 -2 z"/>
    </g>
    <circle cx="437" cy="49" r="6" fill="#fff" opacity=".9"/>
    <text x="437" y="52" font-size="8" font-weight="800" fill="#000" text-anchor="middle">3</text>
    <g fill="#fff" opacity=".45">
      <rect x="457" y="51" width="17" height="12" rx="3"/>
      <rect x="462" y="48.5" width="7" height="3.5" rx="1.2"/>
    </g>
    <circle cx="465.5" cy="57" r="3.2" fill="#000"/>
    <path d="M907.5 52.5 A7 7 0 1 0 916.5 52.5" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="912" y1="48" x2="912" y2="56" stroke="#fff" stroke-opacity=".5" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Trình phát nhạc -->
    <rect x="370" y="96" width="110" height="110" rx="18" fill="url(#art)" opacity=".65" filter="url(#b16)"/>
    <rect x="370" y="96" width="110" height="110" rx="18" fill="url(#art)"/>
    <circle cx="425" cy="151" r="32" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
    <circle cx="425" cy="151" r="20" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="2"/>
    <circle cx="425" cy="151" r="7" fill="#fff" opacity=".55"/>
    <text x="500" y="122" font-size="17" font-weight="700" fill="#fff">Late Night Lo-fi</text>
    <text x="500" y="144" font-size="14" fill="#fff" opacity=".6">Notch FM</text>
    <g fill="#ffb347">
      <rect class="eq" x="568" y="132" width="3" height="14" rx="1.5"/>
      <rect class="eq e2" x="574" y="132" width="3" height="14" rx="1.5"/>
      <rect class="eq e3" x="580" y="132" width="3" height="14" rx="1.5"/>
      <rect class="eq e4" x="586" y="132" width="3" height="14" rx="1.5"/>
    </g>
    <text x="500" y="176" font-size="11" fill="#fff" opacity=".5">1:42</text>
    <rect x="530" y="171" width="96" height="5" rx="2.5" fill="#fff" opacity=".18"/>
    <rect class="prog" x="530" y="171" width="96" height="5" rx="2.5" fill="url(#art)"/>
    <text x="632" y="176" font-size="11" fill="#fff" opacity=".5">3:58</text>
    <g fill="#fff">
      <path d="M538 192 L528 200 L538 208 Z M548 192 L538 200 L548 208 Z"/>
      <rect x="566" y="191" width="5" height="18" rx="1.5"/>
      <rect x="576" y="191" width="5" height="18" rx="1.5"/>
      <path d="M600 192 L610 200 L600 208 Z M610 192 L620 200 L610 208 Z"/>
    </g>

    <line x1="676" y1="92" x2="676" y2="255" stroke="#fff" stroke-opacity=".08"/>

    <!-- Lịch -->
    <text x="696" y="102" font-size="12" font-weight="700" fill="#fff" opacity=".85">Tháng 11, 2026</text>
    <path d="M893 94 l-4 4 l4 4" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M907 94 l4 4 l-4 4" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <g font-size="10" fill="#fff" text-anchor="middle" font-weight="600">
      <text x="708" y="124" opacity=".45">T3</text>
      <text x="740" y="124" opacity=".45">T4</text>
      <text x="773" y="124" opacity=".45">T5</text>
      <text x="805" y="124" opacity=".45">T6</text>
      <text x="837" y="124" opacity=".3">T7</text>
      <text x="869" y="124" opacity=".3">CN</text>
      <text x="902" y="124" opacity=".45">T2</text>
    </g>
    <circle cx="805" cy="142" r="12" fill="#ff453a"/>
    <g font-size="13" fill="#fff" text-anchor="middle">
      <text x="708" y="147" opacity=".8">10</text>
      <text x="740" y="147" opacity=".8">11</text>
      <text x="773" y="147" opacity=".8">12</text>
      <text x="805" y="147" font-weight="700">13</text>
      <text x="837" y="147" opacity=".5">14</text>
      <text x="869" y="147" opacity=".5">15</text>
      <text x="902" y="147" opacity=".8">16</text>
    </g>
    <g fill="#fff" opacity=".55">
      <circle cx="708" cy="162" r="1.6"/><circle cx="805" cy="162" r="1.6"/>
      <circle cx="837" cy="162" r="1.6"/><circle cx="902" cy="162" r="1.6"/>
    </g>
    <rect x="696" y="178" width="3" height="26" rx="1.5" fill="#4cd6c8"/>
    <text x="706" y="189" font-size="12" font-weight="700" fill="#fff" opacity=".92">Daily standup</text>
    <text x="706" y="203" font-size="11" fill="#fff" opacity=".5">09:30 – 09:45</text>
    <rect x="858" y="182" width="58" height="20" rx="10" fill="#0a84ff"/>
    <rect x="866" y="188" width="9" height="8" rx="2" fill="#fff"/>
    <path d="M876 192 l4 -3 v6 z" fill="#fff"/>
    <text x="884" y="196" font-size="10.5" font-weight="700" fill="#fff">Meet</text>
    <rect x="696" y="216" width="3" height="26" rx="1.5" fill="#bf5af2"/>
    <text x="706" y="227" font-size="12" font-weight="700" fill="#fff" opacity=".92">Ship v1.0</text>
    <text x="706" y="241" font-size="11" fill="#fff" opacity=".5">14:00 – 15:00</text>
  </g>

  <!-- Tiêu đề -->
  <text x="640" y="582" font-size="96" font-weight="800" fill="url(#title)" text-anchor="middle" letter-spacing="-3">Notch</text>
  <text x="640" y="628" font-size="24" fill="#fff" opacity=".88" text-anchor="middle">Biến “tai thỏ” MacBook thành trung tâm điều khiển</text>
  <g font-size="14" text-anchor="middle">
    <rect x="375" y="652" width="81" height="32" rx="16" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".14"/>
    <text x="415.5" y="673" fill="#fff" opacity=".85">♪ Nhạc</text>
    <rect x="468" y="652" width="112" height="32" rx="16" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".14"/>
    <text x="524" y="673" fill="#fff" opacity=".85">Lịch &amp; Meet</text>
    <rect x="592" y="652" width="96" height="32" rx="16" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".14"/>
    <text x="640" y="673" fill="#fff" opacity=".85">Khay file</text>
    <rect x="700" y="652" width="81" height="32" rx="16" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".14"/>
    <text x="740.5" y="673" fill="#fff" opacity=".85">Báo pin</text>
    <rect x="793" y="652" width="112" height="32" rx="16" fill="#d97757" fill-opacity=".14" stroke="#d97757" stroke-opacity=".6"/>
    <text x="849" y="673" fill="#f3a585">Claude Code</text>
  </g>
</svg>
