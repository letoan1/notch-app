<style>
text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.peek { animation: peek 3s ease-in-out infinite; }
@keyframes peek { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.heart { animation: heart 2.6s ease-in-out infinite; }
@keyframes heart { 0% { opacity: 0; transform: translateY(6px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(-18px); } }
.spark { animation: spark 2.6s ease-in-out infinite; }
@keyframes spark { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
.eq { transform-box: fill-box; transform-origin: 50% 100%; animation: eq 2.8s ease-in-out infinite; }
.e2 { animation-duration: 3.2s; } .e3 { animation-duration: 2.5s; } .e4 { animation-duration: 3.5s; }
@keyframes eq { 0%, 100% { transform: scaleY(.45); } 35% { transform: scaleY(1); } 70% { transform: scaleY(.65); } }
</style>
