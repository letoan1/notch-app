rd SE', 'Marker Felt', 'Comic Sans MS', cursive" font-size="13" fill="#f0e3cc" opacity=".7">Photos are Polaroids, music is tapes, everything else is a floppy with a handwritten label.</text></g><text x="656" y="352" font-size="14" font-weight="700" fill="#fff" opacity=".9">Tray</text><text x="656" y="371" font-size="12.5" fill="#fff" opacity=".55">Drop a file and it slides into the slot; remove it and it pops out like an ejected tape.</text>
<g transform="translate(40,386)"><path d="M0 0 H584 V188 Q584 214 558 214 H26 Q0 214 0 188 Z" fill="#141210" stroke="#4a403a"/><defs><linearGradient id="devel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffcf9a"/><stop offset="1" stop-color="#9f6b7e"/></linearGradient></defs><rect x="16" y="20" width="300" height="176" rx="12" fill="#efe6d4"/><rect x="16" y="160" width="300" height="36" rx="0" fill="#5a3d2b"/><path d="M16 184 Q16 196 28 196 H304 Q316 196 316 184" fill="#5a3d2b"/><rect x="28" y="30" width="276" height="124" rx="6" fill="#3a2f2a"/><circle cx="166" cy="84" r="24" fill="#d9a07a"/><path d="M118 154 C120 120 140 112 166 112 C192 112 212 120 214 154 Z" fill="#33465e"/><path d="M142 78 C142 56 190 52 190 78 C184 66 150 64 142 78 Z" fill="#2a1d14"/><circle cx="40" cy="178" r="9" fill="#1c1c1c" stroke="#888" stroke-width="2"/><text x="166" y="183" font-family="'Chalkboard SE', 'Marker Felt', 'Comic Sans MS', cursive" font-size="12" font-weight="700" fill="#f0e3cc" text-anchor="middle">INSTANT PHOTO</text><g transform="rotate(6 430 100)"><rect x="352" y="22" width="150" height="170" fill="#f7f3ea"/><rect x="362" y="32" width="130" height="120" fill="url(#devel)"/><circle cx="427" cy="82" r="20" fill="#d9a07a" opacity=".55"/><path d="M392 152 C394 124 410 116 427 116 C444 116 460 124 462 152 Z" fill="#33465e" opacity=".5"/><text x="427" y="178" font-family="'Chalkboard SE', 'Marker Felt', 'Comic Sans MS', cursive" font-size="13" fill="#2b2621" text-anchor="middle">developing…</text></g><rect x="330" y="186" width="70" height="22" rx="5" fill="#ffd27a" stroke="#7a6b52"/><text x="365" y="201" font-family="'Chalkboard SE', 'Marker Felt', 'Comic Sans MS', cursive" font-size="12" font-weight="700" fill="#2b2621" text-anchor="middle">● Shoot</text></g><text x="40" y="622" font-size="14" font-weight="700" fill="#fff" opacity=".9">Mirror</text><text x="40" y="641" font-size="12.5" fill="#fff" opacity=".55">Press Shoot and the photo slides out and develops. The saved file is the camera's original.</text>
