 x="292" y="136" width="40" height="38" rx="5" fill="#e8dbc2" stroke="#7a6b52"/><path d="M306.75 149.75 L312 155 L306.75 160.25 Z M312 149.75 L317.25 155 L312 160.25 Z" fill="#2b2621"/><g transform="translate(344,22) rotate(-1.5 114.0 90.0)"><rect x="0" y="6" width="228" height="174" rx="6" fill="#f6efdc"/><rect x="0" y="6" width="228" height="30" rx="6" fill="#b5332c"/><rect x="0" y="26" width="228" height="10" fill="#b5332c"/><rect x="46" y="0" width="8" height="18" rx="4" fill="#c9c4bb"/><rect x="174" y="0" width="8" height="18" rx="4" fill="#c9c4bb"/><text x="114.0" y="28" font-family="'Chalkboard SE', 'Marker Felt', 'Comic Sans MS', cursive" font-size="15" font-weight="700" fill="#fdeedd" text-anchor="middle">November 2026</text><text x="22" y="57" font-family="'Chalkboard SE', 'Marker Felt', 'Comic Sans MS', cursive" font-size="15" font-weight="700" fill="#2b2621" text-anchor="middle">11</text><text x="53" y="57" font-family="'Chalkboard SE', 'Marker Felt', 'Comic Sans MS', cursive" font-size="15" font-weight="700" fill="#2b2621" text-anchor="middle">12</text><text x="84" y="57" font-family="'Chalkboard SE', 'Marker Felt', 'Comic Sans MS', cursive" font-size="15" font-weight="700" fill="#2b2621" text-anchor="middle">13</text><rect x="102" y="40" width="26" height="22" fill="#fff5b8"/><text x="115" y="57" font-family="'Chalkboard SE', 'Marker Felt', 'Comic Sans MS', cursive" font-size="15" font-weight="700" fill="#2b2621" text-anchor="middle">14</text><text x="146" y="57" font-family="'Chalkboard SE', 'Marker Felt', 'Comic Sans MS', cursive" font-size="15" font-weight="700" fill="#b07a5c" text-anchor="middle">15</text><circle cx="146" cy="64" r="2" fill="#e33b3b"/><text x="177" y="57" font-family="'Chalkboard SE', 'Marker Felt', 'Comic Sans MS', cursive" font-size="15" font-weight="700" fill="#b07a5c" text-anchor="middle">16</text><circle cx="177" cy="64" r="2" fill="#e33b3b"/><text x="208" y="57" font-family="'Chalkboard SE', 'Marker Felt', 'Comic Sans MS', cursive" font-size="15" font-weight="700" fill="#b07a5c" text-anchor="middle">17</text><circle cx="208" cy="64" r="2" fill="#e33b3b"/><text x="14" y="112" font-family="'Chalkboard SE', 'Marker Felt', 'Comic Sans MS', cursive" font-size="46" font-weight="700" fill="#2b2621">14</text><text x="78" y="96" font-family="'Chalkboard SE', 'Marker Felt', 'Comic Sans MS', cursive" font-size="16" fill="#2b2621">Saturday</text><text x="78" y="114" font-family="'Chalkboard SE', 'Marker Felt', 'Comic Sans MS', cursive" font-size="11" fill="#2b2621" opacity=".6">3 things today</text><text x="14" y="136" font-family="'Chalkboard SE', 'Marker Felt', 'Comic Sans MS', cursive" font-size="12" fill="#2b2621">• 09:30  Daily standup</text><rect x="170" y="124" width="46" height="16" rx="5" fill="#d9cdb2"/><text x="193" y="136" font-family="'Chalkboard SE', 'Marker Felt', 'Comic Sans MS', cursive" font-size="11" font-weight="700" fill="#2b2621" text-anchor="middle">Meet</text><text x="14" y="151" font-family="'Chalkboard SE', 'Marker Felt', 'Comic Sans MS', cursive" font-size="12" fill="#2b2621">• 14:00  Design review</text><text x="14" y="166" font-family="'Chalkboard SE', 'Marker Felt', 'Comic Sans MS', cursive" font-size="12" fill="#2b2621">• 16:30  Client call</text></g></g><text x="40" y="352" font-size="14" font-weight="700" fill="#fff" opacity=".9">Music &amp; calendar</text><text x="40" y="371" font-size="12.5" fill="#fff" opacity=".55">Drag the tape sideways to scrub; the reels spin fast with static. Change the day and the page tears off.</text>
<g transform="translate(656,116)"><path d="M0 0 H584 V188 Q584 214 558 214 H26 Q0 214 0 188 Z" fill="#141210" stroke="#4a403a"/><g transform="rotate(0 68 102)" opacity="1"><path d="M20 52 h86 l10 10 v86 h-96 Z" fill="#c8433a"/><rect x="42" y="52" width="46" height="26" fill="#cfd2d6"/><rect x="68" y="56" width="10" height="18" fill="#3a3a3a"/><rect x="32" y="96" width="72" height="44" fill="#f4ecdc"/><rect x="32" y="96" width="72" height="5" fill="#ff8a5c"/><text x="68" y="120" font-family="'Chalkboard SE', 'Marker Felt', 'Comic Sans MS', cursive" font-size="14" fill="#2b2621" text-anchor="middle">report</text><text x="68" y="136" font-family="'Chalkboard SE', 'Marker Felt', 'Comic Sans MS', cursive" font-size="12" font-weight="700" fill="#d33" text-anchor="middle">PDF</text></g><g transform="rotate(0 176 102)" opacity="1"><path d="M128 52 h86 l10 10 v86 h-96 Z" fill="#1f63c4"/><rect x="150" y="52" width="46" height="26" fill="#cfd2d6"/><rect x="176" y="56" width="10" height="18" fill="#3a3a3a"/><rect x="140" y="96" width="72" height="44" fill="#f4ecdc"/><rect x="140" y="96" width="72" height="5" fill="#ff8a5c"/><text x="176" y="120" font-family="'Chalkboard SE', 'Marker Felt', 'Comic Sans MS', cursive" font-size="14" fill="#2b2621" text-anchor="middle">main</text><text x="176" y="136" font-family="'Chalkboard SE', 'Marker Felt', 'Comic Sans MS', cursive" font-size="12" font-weight="700" fill="#d33" text-anchor="middle">SWIFT</text></g><g transform="translate(236,64)"><rect width="118" height="76" rx="7" fill="#2f2a25" stroke="#5a4e44"/><rect x="8" y="8" width="102" height="34" rx="4" fill="#f0e3cc"/><rect x="8" y="8" width="102" height="9" rx="4" fill="#ff8a5c"/><text x="59" y="35" font-family="'Chalkboard SE', 'Marker Felt', 'Comic Sans MS', cursive" font-size="13" fill="#2b2621" text-anchor="middle">demo.mp3</text><rect x="30" y="48" width="58" height="18" rx="9" fill="#151210"/><g class=""><circle cx="45" cy="57" r="6" fill="#593b26"/><circle cx="45" cy="57" r="