="13" fill="#2b2621">npm run build &amp;&amp; npm test</text><text x="48" y="98" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="13" fill="#2b2621">Always allow:</text><text x="150" y="98" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="13" fill="#2b2621">Bash(npm test:*), this session only</text><g transform="rotate(-3 205.5 160)"><rect x="150" y="138" width="111" height="40" rx="6" fill="none" stroke="#8a8a8a" stroke-width="3"/><rect x="155" y="143" width="101" height="30" rx="4" fill="none" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="4 3"/><text x="205.5" y="165" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="16" font-weight="800" fill="#8a8a8a" text-anchor="middle" letter-spacing="2">DENY</text></g><g transform="rotate(2 359.0 160)"><rect x="284" y="138" width="150" height="40" rx="6" fill="none" stroke="#3a78d6" stroke-width="3"/><rect x="289" y="143" width="140" height="30" rx="4" fill="none" stroke="#3a78d6" stroke-width="1.2" stroke-dasharray="4 3"/><text x="359.0" y="165" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="16" font-weight="800" fill="#3a78d6" text-anchor="middle" letter-spacing="2">ALWAYS</text></g><g transform="rotate(-4 494.5 160)"><rect x="452" y="138" width="85" height="40" rx="6" fill="none" stroke="#d93a3a" stroke-width="3"/><rect x="457" y="143" width="75" height="30" rx="4" fill="none" stroke="#d93a3a" stroke-width="1.2" stroke-dasharray="4 3"/><text x="494.5" y="165" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="16" font-weight="800" fill="#d93a3a" text-anchor="middle" letter-spacing="2">ALLOW</text></g></g></g><text x="656" y="622" font-size="14" font-weight="700" fill="#fff" opacity=".9">Claude Code</text><text x="656" y="641" font-size="12.5" fill="#fff" opacity=".55">The telex prints line by line. Press a button and that stamp lands on the paper.</text>
