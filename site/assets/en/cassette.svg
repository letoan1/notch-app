<text x="40" y="58" font-size="26" font-weight="800" fill="#fff">Cassette: an 80s analog corner</text>
<text x="40" y="88" font-size="15" fill="#fff" opacity=".62">Tapes, a tear-off calendar, floppies, an instant camera and a telex.</text>
