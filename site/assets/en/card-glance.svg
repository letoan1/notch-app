<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#134e4a"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff4f8b"/>
    </linearGradient>
    <clipPath id="card"><rect width="640" height="380" rx="28"/></clipPath>
    <filter id="b60" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="b10" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .eq { transform-box: fill-box; transform-origin: 50% 50%; animation: eq .8s ease-in-out infinite alternate; }
    .e2 { animation-duration: .55s; } .e3 { animation-duration: .95s; } .e4 { animation-duration: .68s; }
    @keyframes eq { from { transform: scaleY(.3); } to { transform: scaleY(1); } }
    .charge { animation: charge 1.4s ease-in-out infinite alternate; }
    @keyframes charge { from { opacity: .55; } to { opacity: 1; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="640" height="380" fill="#0d0d18"/>
    <circle cx="90" cy="330" r="170" fill="#30d158" opacity=".2" filter="url(#b60)"/>
    <text x="36" y="56" font-size="24" font-weight="800" fill="#fff">Collapsed, still informative</text>
    <text x="36" y="84" font-size="14" fill="#fff" opacity=".6">Plug in and the notch shows battery %. While music plays, the wings show artwork and a visualizer.</text>

    <rect x="36" y="112" width="568" height="300" rx="18" fill="url(#wall)"/>
    <rect x="36" y="112" width="568" height="26" fill="#fff" opacity=".18"/>

    <!-- Notch thu gọn: báo pin -->
    <path d="M110 112 Q118 112 118 120 L118 137 Q118 150 131 150 L509 150 Q522 150 522 137 L522 120 Q522 112 530 112 Z" fill="#000"/>
    <path d="M138 121 l-7 11 h5 l-2 9 l8 -12 h-5 z" fill="#30d158"/>
    <text x="150" y="136" font-size="13" font-weight="700" fill="#fff" opacity=".9">Charging</text>
    <text x="436" y="136" font-size="13" font-weight="700" fill="#30d158">80%</text>
    <rect x="472" y="124" width="30" height="14" rx="4" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.2"/>
    <rect class="charge" x="474.5" y="126.5" width="20" height="9" rx="2" fill="#30d158"/>
    <rect x="503.5" y="128.5" width="2" height="5" rx="1" fill="#fff" opacity=".5"/>
    <text x="320" y="182" font-size="12" fill="#fff" opacity=".7" text-anchor="middle">↑ just plugged in</text>

    <!-- Notch thu gọn: đang phát nhạc -->
    <text x="320" y="226" font-size="12" fill="#fff" opacity=".7" text-anchor="middle">while music plays ↓</text>
    <rect x="200" y="246" width="240" height="40" rx="14" fill="#000" opacity=".5" transform="translate(0 6)" filter="url(#b10)"/>
    <path d="M200 240 h240 v32 a14 14 0 0 1 -14 14 h-212 a14 14 0 0 1 -14 -14 z" fill="#000"/>
    <rect x="212" y="249" width="27" height="27" rx="6" fill="url(#art)"/>
    <circle cx="225.5" cy="262.5" r="7" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="1.5"/>
    <g fill="#ffb347">
      <rect class="eq" x="410" y="255" width="2.5" height="14" rx="1.25"/>
      <rect class="eq e2" x="415" y="255" width="2.5" height="14" rx="1.25"/>
      <rect class="eq e3" x="420" y="255" width="2.5" height="14" rx="1.25"/>
      <rect class="eq e4" x="425" y="255" width="2.5" height="14" rx="1.25"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="639" height="379" rx="27.5" fill="none" stroke="#fff" stroke-opacity=".08"/>
</svg>
