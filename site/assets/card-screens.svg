<text x="444" y="149" font-size="10" font-weight="700" fill="#fff">Lặng</text><text x="444" y="162" font-size="8.5" fill="#fff" opacity=".6">Rhymastic</text>
<rect x="444" y="168" width="80" height="3" rx="1.5" fill="#fff" opacity=".2"/><rect x="444" y="168" width="46" height="3" rx="1.5" fill="#ffb347"/>
