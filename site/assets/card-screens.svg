<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
<defs>
<linearGradient id="wallA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#4338ca"/></linearGradient>
<linearGradient id="wallB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a3412"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
<linearGradient id="art" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ff4f8b"/></linearGradient>
<linearGradient id="shot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
<linearGradient id="shot2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
<linearGradient id="shot3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
<clipPath id="card"><rect width="640" height="400" rx="28"/></clipPath>
<filter id="b60" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="60"/></filter>
<filter id="b8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.eq { transform-box: fill-box; transform-origin: 50% 50%; animation: eq .8s ease-in-out infinite alternate; }
.e2 { animation-duration: .55s; } .e3 { animation-duration: .95s; } .e4 { animation-duration: .68s; }
@keyframes eq { from { transform: scaleY(.3); } to { transform: scaleY(1); } }
.cur { animation: cur 3s ease-in-out infinite; } @keyframes cur { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-6px,4px); } }
</style>
<g clip-path="url(#card)"><rect width="640" height="400" fill="#0d0d18"/>
<circle cx="540" cy="90" r="170" fill="#7c3aed" opacity=".2" filter="url(#b60)"/>
<text x="36" y="56" font-size="24" font-weight="800" fill="#fff">Mọi màn hình, cùng một notch</text>
<text x="36" y="84" font-size="14" fill="#fff" opacity=".6">Nhạc, khay và lịch giống nhau trên mọi màn hình. Chỉ notch dưới con trỏ mở ra.</text>
