<rect x="452" y="286" width="20" height="16" fill="#374151"/><rect x="420" y="300" width="84" height="6" rx="3" fill="#374151"/>
<text x="462" y="330" font-size="12.5" fill="#fff" opacity=".7" text-anchor="middle">Màn rời, notch vẽ đang mở</text>
<text x="36" y="372" font-size="12.5" fill="#fff" opacity=".6">Kích thước khi mở</text>
<rect x="150" y="356" width="60" height="24" rx="7" fill="#fff" opacity="0.07"/><text x="180" y="373" font-size="12" fill="#fff" text-anchor="middle">Gọn</text>
<rect x="214" y="356" width="60" height="24" rx="7" fill="#fff" opacity="0.22"/><text x="244" y="373" font-size="12" fill="#fff" text-anchor="middle">Vừa</text>
<rect x="278" y="356" width="60" height="24" rx="7" fill="#fff" opacity="0.07"/><text x="308" y="373" font-size="12" fill="#fff" text-anchor="middle">Rộng</text>
<text x="604" y="373" font-size="12.5" fill="#fff" opacity=".6" text-anchor="end">Toàn màn hình thì notch tự thu gọn</text>
</g></svg>